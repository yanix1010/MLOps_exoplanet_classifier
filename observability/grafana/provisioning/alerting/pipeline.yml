apiVersion: 1
groups:
  - orgId: 1
    name: Pipeline
    folder: Exoplanet
    interval: 10s
    rules:
      - uid: queue-saturation
        title: Очередь заполнена более чем на 90%
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Очередь задач больше минуты занята более чем на 90%.
        data:
          - refId: A
            relativeTimeRange: {from: 60, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: '(sum(rabbitmq_detailed_queue_messages_ready{queue="tasks"}) / (max(exoplanet_queue_limit) > 0)) or vector(0)'
              instant: true
              range: false
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.9]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query
      - uid: dead-letters
        title: Появились сообщения в DLQ
        condition: B
        for: 10s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: В очереди tasks_dlq есть сообщения.
        data:
          - refId: A
            relativeTimeRange: {from: 60, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: 'sum(rabbitmq_detailed_queue_messages_ready{queue="tasks_dlq"}) or vector(0)'
              instant: true
              range: false
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query
