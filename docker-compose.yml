name: mlops_exoplanet_classifier

x-telemetry-env: &telemetry-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=local}

services:
  postgres:
    image: postgres:16-alpine
    container_name: exoplanet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exoplanet_classifier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - exoplanet_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d exoplanet_classifier" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exoplanet_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *telemetry-env
      OTEL_SERVICE_NAME: app
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/exoplanet_classifier"
      PORT: 8000
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      QUEUE_MAX_LENGTH: "${QUEUE_MAX_LENGTH:-50}"
      INFERENCE_DELAY_SECONDS: "${INFERENCE_DELAY_SECONDS:-0.5}"
    networks:
      - exoplanet_network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "src.worker"]
    stop_grace_period: 20s
    expose:
      - "8001"
    environment:
      <<: *telemetry-env
      OTEL_SERVICE_NAME: worker
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/exoplanet_classifier"
      MLFLOW_TRACKING_URI: "http://mlflow_server:5000"
      MODEL_NAME: "kepler_exoplanet_classifier"
      MODEL_ALIAS: "champion"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      PREFETCH_COUNT: "${PREFETCH_COUNT:-1}"
      INFERENCE_DELAY_SECONDS: "${INFERENCE_DELAY_SECONDS:-0.5}"
      QUEUE_MAX_LENGTH: "${QUEUE_MAX_LENGTH:-50}"
      WORKER_HEALTH_PORT: "8001"
    networks:
      - exoplanet_network
    depends_on:
      postgres:
        condition: service_healthy
      mlflow_server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  producer:
    profiles: [batch]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.batch_producer"]
    environment:
      <<: *telemetry-env
      OTEL_SERVICE_NAME: producer
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      QUEUE_MAX_LENGTH: "${QUEUE_MAX_LENGTH:-50}"
      MAX_TASKS: "${MAX_TASKS:-}"
    volumes:
      - ./data/raw:/app/data/raw:ro
    networks: [exoplanet_network]
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mlflow_db:
    image: postgres:16-alpine
    container_name: mlflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_DB: mlflow_db
    ports:
      - "5433:5432"
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    networks:
      - exoplanet_network

  mlflow_server:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: mlflow_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://mlflow:mlflow_password@mlflow_db:5432/mlflow_db
    volumes:
      - ./mlflow_artifacts:/mlflow/artifacts
    networks:
      - exoplanet_network
    depends_on:
      - mlflow_db
    command: >
      bash -c "pip install psycopg2-binary && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql+psycopg2://mlflow:mlflow_password@mlflow_db:5432/mlflow_db --default-artifact-root mlflow-artifacts:/ --artifacts-destination /mlflow/artifacts --serve-artifacts --allowed-hosts localhost:*,127.0.0.1:*,mlflow_server:*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: exoplanet_rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./observability/rabbitmq-plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - exoplanet_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    profiles: [observability, traces, metrics]
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/collector.yml"]
    volumes:
      - ./observability/collector.yml:/etc/otelcol/collector.yml:ro
    ports:
      - "127.0.0.1:13133:13133"
    networks: [exoplanet_network]
    mem_limit: 144m

  tempo:
    profiles: [observability, traces]
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks: [exoplanet_network]
    mem_limit: 192m

  loki:
    profiles: [observability, logs]
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [exoplanet_network]
    mem_limit: 256m

  alloy:
    profiles: [observability, logs]
    image: grafana/alloy:v1.8.2
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    environment:
      OBSERVABILITY_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy
    networks: [exoplanet_network]
    mem_limit: 192m

  prometheus:
    profiles: [observability, metrics]
    image: prom/prometheus:v3.3.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [exoplanet_network]
    mem_limit: 192m

  grafana:
    profiles: [observability, logs, traces, metrics]
    image: grafana/grafana:11.6.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [exoplanet_network]
    mem_limit: 256m

networks:
  exoplanet_network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_db_data:
  rabbitmq_data:
  alloy_data:
  grafana_data:
  loki_data:
  prometheus_data:
  tempo_data:
